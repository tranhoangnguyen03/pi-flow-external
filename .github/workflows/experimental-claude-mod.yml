name: Experimental Claude Mod
on:
  pull_request:
    paths:
      - 'experiments/claude-mod/**'
      - '.github/workflows/experimental-claude-mod.yml'
  push:
    branches:
      - 'experimental/claude-mod-*'
    paths:
      - 'experiments/claude-mod/**'
      - '.github/workflows/experimental-claude-mod.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Mod hooks
        run: node --check experiments/claude-mod/hooks/register.js
      - name: Run offline tests
        run: node --test experiments/claude-mod/tests/*.test.mjs
